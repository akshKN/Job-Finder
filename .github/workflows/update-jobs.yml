name: Update jobs

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config/**', 'docs/**', 'scripts/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch postings
        run: node scripts/fetch-jobs.mjs
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JSEARCH_VIA: ${{ vars.JSEARCH_VIA }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}

      - name: Save the updated list
        run: |
          git config user.name "job-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jobs.json
          git diff --cached --quiet || git commit -m "Update job postings"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
